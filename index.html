<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicAI - Talent Analytics & Recruiter Alignment</title>
    <!-- Plotly CDN for Interactive Statistics Plots -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js" charset="utf-8"></script>
  </head>
  <body class="bg-[#0b0f19] text-slate-100 min-h-screen">
    <!-- Navbar -->
    <header class="sticky top-0 z-40 w-full border-b border-white/10 bg-[#0b0f19]/80 backdrop-blur-md">
      <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <!-- Logo -->
        <div class="flex items-center gap-2.5 cursor-pointer" id="nav-logo">
          <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-500 font-bold text-slate-950 shadow-lg shadow-cyan-500/20">
            C
          </div>
          <div>
            <span class="font-display text-lg font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-300 bg-clip-text text-transparent">CivicAI</span>
            <span class="text-[10px] block font-mono text-cyan-400 uppercase tracking-widest -mt-1">Talent Pool</span>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex space-x-1 p-1 bg-white/5 rounded-xl border border-white/5" aria-label="Tabs">
          <button id="tab-home" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all cursor-pointer bg-white/10 text-white" data-tab="home">
            Home
          </button>
          <button id="tab-census" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all cursor-pointer text-slate-400 hover:text-white" data-tab="census">
            Talent Portal
          </button>
          <button id="tab-recruiter" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all cursor-pointer text-slate-400 hover:text-white" data-tab="recruiter">
            Recruiter Hub
          </button>
          <button id="tab-analytics" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all cursor-pointer text-slate-400 hover:text-white" data-tab="analytics">
            Analytics
          </button>
        </nav>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <!-- Container for Dynamic Views -->
      <div id="view-container" class="space-y-8"></div>
    </main>

    <!-- Slide-out Recruiter Candidate Detail Drawer -->
    <div id="drawer-overlay" class="fixed inset-0 z-50 overflow-hidden bg-black/60 backdrop-blur-md hidden flex justify-end">
      <div class="absolute inset-0 cursor-pointer" id="drawer-close-overlay"></div>
      <div id="candidate-drawer" class="relative w-full max-w-2xl bg-[#0d1222]/95 border-l border-white/15 h-full shadow-2xl flex flex-col justify-between overflow-y-auto backdrop-blur-2xl transition-transform duration-300 translate-x-full">
        <!-- Drawer content injected dynamically via main.ts -->
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-2xl border border-emerald-500/30 bg-emerald-950/90 text-emerald-200 text-sm font-semibold translate-y-24 transition-all duration-300">
      <span id="toast-message">Success message</span>
    </div>

    <!-- Footer -->
    <footer class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8 border-t border-white/5 mt-12">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <p class="text-xs text-slate-500">&copy; 2026 CivicAI. Classical ML-Driven Workforce Demographics & Alignment Platform.</p>
        <div class="flex items-center gap-4 text-xs text-slate-400">
          <span>Powered by Gemini 3.5 Flash</span>
          <span>&middot;</span>
          <span>Vanilla Architecture</span>
        </div>
      </div>
    </footer>

    <!-- Main Scripts -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
